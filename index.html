<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Partner">
<meta name="theme-color" content="#0b0d18">
<title>Life Partner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- ホーム画面から開いたときの起動画像（白い画面を出さない） -->
<link rel="apple-touch-startup-image" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)" href="launch_1290x2796.jpg">
<link rel="apple-touch-startup-image" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)" href="launch_1179x2556.jpg">
<link rel="apple-touch-startup-image" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)" href="launch_1284x2778.jpg">
<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" href="launch_1170x2532.jpg">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" href="launch_1125x2436.jpg">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)" href="launch_1242x2688.jpg">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" href="launch_828x1792.jpg">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)" href="launch_750x1334.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;700&family=Quicksand:wght@300;400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" data-tab="home">

  <!-- 乃亜（全画面） -->
  <div id="stage"><div class="lift"><img class="f fa" alt=""><img class="f fx" alt=""><img class="f fb" alt=""></div><div class="shade"></div></div>
  <canvas id="motes"></canvas>

  <!-- ホーム：ロック画面 -->
  <div id="homeTop"><div id="hmDate"></div><div id="hmTime"></div><div id="hmWx"></div></div>

  <!-- 下の帯（そのタブの要点と＋） -->
  <div id="strip"><div id="stripText"></div><button id="fab" aria-label="一言入れる"></button></div>

  <!-- パネル（帯をタップで開く） -->
  <section id="panel">
    <div class="pn-h"><i class="grab"></i><button id="panelX" aria-label="閉じる"></button></div>
    <div id="panelBody"></div>
  </section>

  <nav id="tabs">
    <button data-v="home" class="on"></button><button data-v="desk"></button><button data-v="clinic"></button><button data-v="bank"></button><button data-v="room"></button>
  </nav>

  <!-- 乃亜と話す -->
  <div id="talk">
    <div class="nv">
      <div class="nv-name"><b>乃亜</b><em id="twMode"></em><button id="twX" aria-label="閉じる"></button></div>
      <p id="twMe"></p>
      <div id="twText"></div><i id="twNext"></i>
      <div id="twChoice"></div>
      <div id="twChips" class="chips"></div>
      <form id="twForm"><input id="twIn" placeholder="乃亜に話す" autocomplete="off" enterkeyhint="send"><button class="btn">送る</button></form>
    </div>
  </div>

  <!-- タブのスプラッシュ -->
  <div id="splash"><img alt=""><div class="sp-card"><span class="sp-en"></span><i class="sp-line"></i><b class="sp-ja"></b><small class="sp-sub"></small></div></div>

  <!-- 一言入力 -->
  <div class="sheet" id="inSheet"><div class="in">
    <div class="in-h"><b>乃亜に伝える</b><label class="ph-btn" aria-label="写真"><span id="phIc"></span><input type="file" id="inPhoto" accept="image/*" hidden></label></div>
    <div class="chips" id="inUsual"></div>
    <form id="inForm"><input id="inText" placeholder="例）金曜19時 坂井さん" autocomplete="off" enterkeyhint="done"></form>
    <p class="mini" id="inHint"></p>
  </div></div>
  <div id="echo"></div>
  <div id="toast"></div>

  <!-- 起動画面 -->
  <div id="title"><div class="ti-img"></div><div class="ti-blink"></div><div class="ti-shade"></div>
    <div class="ti-logo"><small>LIFE PARTNER</small><b>Noa</b><i></i><span class="ti-tap">TOUCH TO START</span></div>
    <div class="ti-lock"></div></div>
</div>

<script src="core.js"></script>
<script src="ui.js"></script>
<script src="noa.js"></script>
<script src="data.js"></script>
<script src="input.js"></script>
<script src="talk.js"></script>
<script src="home.js"></script>
<script src="desk.js"></script>
<script src="clinic.js"></script>
<script src="bank.js"></script>
<script src="vault.js"></script>
<script src="room.js"></script>
<script src="title.js"></script>
<script src="app.js"></script>
<script>
  // アイコンを入れる（絵文字は使わない）
  document.querySelectorAll('#tabs button').forEach(b => b.innerHTML = IC(b.dataset.v) + `<span>${TABS[b.dataset.v].name}</span>`);
  $('fab').innerHTML = IC('plus'); $('panelX').innerHTML = IC('x'); $('twX').innerHTML = IC('x'); $('phIc').innerHTML = IC('cam');
</script>
</body>
</html>
